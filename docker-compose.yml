services:
  comic-tracker:
    build: .
    container_name: comic-tracker
    restart: unless-stopped
    ports:
      - "8010:8000"
    environment:
      - COMICVINE_API_KEY=${COMICVINE_API_KEY}
      - DB_PATH=/app/data/comics.db
      - UPLOAD_DIR=/app/data/uploads
    volumes:
      - ./data:/app/data
