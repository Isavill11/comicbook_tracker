<!DOCTYPE html>
<html lang="en">
<head>

<body>

  <div class="app-wrapper">
    <header class="toobar-header">
      <div class="navbar-wrap">
        <nav class="navbar" aria-label="Primary navigation">
          <div class="navbar-brand">
            <a href="/" class="navbar-brand-link" id="main-logo" title="IV Comics Logo" aria-label="IV Comics Logo"><span class="navbar-brand__mark">IV</span><span class="navbar-brand__text">COMICS</span></a>
            
            <!-- navbar menus li elements on left side of screen -->
            <div id="navbar-navigation" class="navbar-navigation" role="none">
              <ul role="menubar" class="navigation">
                <li role="none" class="navbar-dropdown navigation__item">
                  <a href="browse/comics" class="navigation__link" tabindex="0" title="ALL COMIC SERIES" aria-label="ALL COMIC SERIES" role="menuitem" aria-haspopup="false">ALL COMIC SERIES</a>
                </li>
                <li role="none" class="navigation-dropdown navigation__item">
                  <a href="#" tabindex="0" title="BROWSE COLLECTIONS" aria-label="BROWSE COLLECTIONS" role="menuitem" class="navigation__link navbar-dropdown__toggle" aria-haspopup="true" aria-expanded="false">BROWSE COLLECTIONS</a>
                    <ul aria-label="BROWSE COLLECTIONS" role="menu" class="navbar-dropdown__menu" data-v-2d32f882=""><!--[--><li role="none" class="navbar-dropdown__item" data-v-2d32f882=""><a href="/browse/comics" class="navbar-dropdown__link" tabindex="0" title="TOP STORYLINES" aria-label="TOP STORYLINES" role="menuitem" data-v-2d32f882="">TOP STORYLINES</a></li><li role="none" class="navbar-dropdown__item" data-v-2d32f882=""><a href="/browse/comics?sort=" class="navbar-dropdown__link" tabindex="0" title="EXPLORE CHARACTERS" aria-label="EXPLORE CHARACTERS" role="menuitem" data-v-2d32f882="">EXPLORE CHARACTERS</a></li><li role="none" class="navbar-dropdown__item" data-v-2d32f882=""><a href="/browse/comics?sort&amp;page=1&amp;series" class="navbar-dropdown__link" tabindex="0" title="COMICS SHOWCASE" aria-label="COMICS SHOWCASE" role="menuitem" data-v-2d32f882="">COMICS SHOWCASE</a></li><!--]--></ul>
                </li>
                <li role="none" class="navigation__item" data-v-2d32f882="">
                  <a href="/dc" class="navigation__link" tabindex="0" title="EXPLORE DC" aria-label="EXPLORE DC" role="menuitem" aria-haspopup="false" data-v-2d32f882="">EXPLORE DC</a>
                </li>
                <li role="none" class="navigation__item" data-v-2d32f882="">
                  <a href="/marvel" class="navigation__link" tabindex="0" title="EXPLORE  MARVEL" aria-label="EXPLORE MARVEL" role="menuitem" aria-haspopup="false" data-v-2d32f882="">EXPLORE MARVEL</a>
                </li>
              </ul>

            <!-- Search button right side -->
            <div class="navbar-actions">
              <a href="/search" class="search-button-only" role="button" aria-label="Search"><span class="search-icon" aria-hidden="true"></span><span class="search-label">Search</span></a>
            </div>
          </div>
        </nav>
      </div>
    </header>


    <main class="home-content">
      <section class="masthead-component" aria-labelledby="featured-title">
        <div class="masthead-slider" id="featuredSlides" aria-live="polite"><p class="featured-carousel__status">Loading your collection...</p></div>
        <div class="carousel-progress" id="carouselProgress" aria-label="Choose a featured comic"></div>
        <div class="masthead-controls" aria-label="Carousel controls">
          <button class="masthead-control masthead-control--previous" id="carouselPrevious" type="button" aria-label="Previous comic">&lt;</button>
          <button class="masthead-control masthead-control--next" id="carouselNext" type="button" aria-label="Next comic">&gt;</button>
        </div>
      </section>
      <section class="dive-back-in" aria-labelledby="dive-back-title">
        <div class="collection-heading"><h2 id="dive-back-title">Dive back in</h2><a href="/browse/comics" class="collection-heading__link">View collection</a></div>
        <div class="collection-rail" id="collectionRail"><p class="featured-carousel__status">Loading your collection...</p></div>
      </section>
    </main>



  </div>
</body>
<script src="carousel.js" defer></script>
